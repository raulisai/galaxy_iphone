name: Android validation (Windows/Kotlin)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select preinstalled JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: JVM tests, lint and debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-configuration-cache \
            :core:protocol-kotlin:test :core:notification-domain:test :core:assistant-domain:test \
            :apps:watch:lintDebug :apps:watch:assembleDebug
          sha256sum apps/watch/build/outputs/apk/debug/watch-debug.apk
